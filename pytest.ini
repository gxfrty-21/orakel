[pytest]
# Nur die echten Tests sammeln. Im Review-Paket liegen Kopien unter
# artifacts/review-paket-orakel/dateien/tests; ohne diese Grenze kollidieren
# identische Modulnamen und der lokale Lauf bricht bei der Sammlung ab.
testpaths = tests
norecursedirs = artifacts .git .venv node_modules __pycache__
