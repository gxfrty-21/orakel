name: Tests

# Nur main löst nach einem Push aus; Railway erkennt daran sein "Wait for CI".
# Feature-Branches laufen über pull_request.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v5

      - name: Python einrichten
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      # Als Modul aufrufen, damit das Repo-Root für "import orakel" im Pfad liegt.
      - name: Tests ausführen
        run: python -m pytest -q

  # Stellt sicher, dass das Dockerfile inklusive Seed-DB weiterhin baut.
  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v5

      - name: Buildx einrichten
        uses: docker/setup-buildx-action@v4

      # Layer-Cache aus dem GitHub-Actions-Cache; mode=max cached auch die
      # pip-install-Schicht, nicht nur das Basis-Image.
      - name: Image bauen
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          tags: orakel:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Startet das Image mit aktiviertem Login: Health muss offen bleiben,
      # / muss ohne Zugangsdaten 401 liefern.
      - name: Container starten, Health und Login-Schutz prüfen
        run: |
          docker run --detach --name orakel-smoke --publish 3000:3000 \
            --env ORAKEL_AUTH_USER=orakel --env ORAKEL_AUTH_PASS=geheim \
            orakel:ci

          gesund=0
          for versuch in $(seq 1 30); do
            if antwort=$(curl --silent --show-error --fail http://127.0.0.1:3000/api/health) \
               && python3 -c 'import json,sys; sys.exit(0 if json.loads(sys.argv[1]).get("ok") is True else 1)' "$antwort"; then
              echo "Health-Check ok nach ${versuch} Versuch(en): $antwort"
              gesund=1
              break
            fi
            sleep 2
          done
          if [ "$gesund" -ne 1 ]; then
            echo "Health-Check fehlgeschlagen"
            docker logs orakel-smoke
            exit 1
          fi

          status=$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:3000/)
          if [ "$status" != "401" ]; then
            echo "Erwartet HTTP 401 für /, erhalten $status"
            docker logs orakel-smoke
            exit 1
          fi
          echo "Login-Schutz ok: GET / ohne Zugangsdaten -> HTTP 401"

          status=$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --user orakel:geheim http://127.0.0.1:3000/)
          if [ "$status" != "200" ]; then
            echo "Erwartet HTTP 200 für / mit Zugangsdaten, erhalten $status"
            docker logs orakel-smoke
            exit 1
          fi
          echo "Login ok: GET / mit Zugangsdaten -> HTTP 200"

      - name: Container entfernen
        if: always()
        run: docker rm --force orakel-smoke

  # Prüft die Oberfläche mit 250 % Schrift und langen Komposita in Tabellen.
  # Nutzt die Seed-Datenbank, damit der Lauf ohne eigene Daten reproduzierbar ist.
  text250:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v5

      - name: Python einrichten
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: scripts/package-lock.json

      - name: Python-Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      # Der Schlüssel hängt an der Playwright-Version im Lockfile: Ändert sie
      # sich, wird der Browser neu geladen statt einen alten Cache zu nutzen.
      - name: Playwright-Browser cachen
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('scripts/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Playwright und Chromium installieren
        working-directory: scripts
        run: |
          npm ci
          # Systembibliotheken bringt das ubuntu-24.04-Image mit; --with-deps
          # kostet pro Lauf 8-11 Sekunden apt-Zeit.
          npx playwright install chromium

      - name: Dashboard starten und 250-%-Prüflauf ausführen
        run: |
          set -euo pipefail
          mkdir -p artifacts/text250
          cp seed/orakel-seed.db /tmp/orakel-text250.db
          ORAKEL_DB_PFAD=/tmp/orakel-text250.db \
            python -m orakel serve --host 127.0.0.1 --port 3000 > artifacts/text250/server.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT

          bereit=0
          for versuch in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:3000/api/report > /dev/null; then
              echo "Dashboard bereit nach ${versuch} Versuch(en)"
              bereit=1
              break
            fi
            sleep 1
          done
          if [ "$bereit" -ne 1 ]; then
            echo "Dashboard wurde nicht bereit"
            cat artifacts/text250/server.log
            exit 1
          fi

          if ! node scripts/pruefe-text250.mjs --bilder artifacts/text250; then
            echo "--- Serverprotokoll ---"
            tail -50 artifacts/text250/server.log
            exit 1
          fi

      # Nur bei Befunden: Screenshots je Ansicht und Breite zum Nachschauen.
      - name: Screenshots bei Fehlschlag hochladen
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: text250-screenshots
          path: artifacts/text250/*.png
          if-no-files-found: ignore
          retention-days: 7

      - name: Serverprotokoll bei Fehlschlag hochladen
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: text250-serverlog
          path: artifacts/text250/server.log
          if-no-files-found: ignore
          retention-days: 7
