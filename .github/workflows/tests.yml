name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      # Als Modul aufrufen, damit das Repo-Root für "import orakel" im Pfad liegt.
      - name: Tests ausführen
        run: python -m pytest -q

  # Stellt sicher, dass das Dockerfile inklusive Seed-DB weiterhin baut.
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Buildx einrichten
        uses: docker/setup-buildx-action@v3

      # Layer-Cache aus dem GitHub-Actions-Cache; mode=max cached auch die
      # pip-install-Schicht, nicht nur das Basis-Image.
      - name: Image bauen
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: orakel:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Startet das gebaute Image und prüft den offenen Health-Endpunkt.
      - name: Container starten und /api/health prüfen
        run: |
          docker run --detach --name orakel-smoke --publish 3000:3000 orakel:ci
          for versuch in $(seq 1 30); do
            if antwort=$(curl --silent --show-error --fail http://127.0.0.1:3000/api/health) \
               && python3 -c 'import json,sys; sys.exit(0 if json.loads(sys.argv[1]).get("ok") is True else 1)' "$antwort"; then
              echo "Health-Check ok nach ${versuch} Versuch(en): $antwort"
              exit 0
            fi
            sleep 2
          done
          echo "Health-Check fehlgeschlagen"
          docker logs orakel-smoke
          exit 1

      - name: Container entfernen
        if: always()
        run: docker rm --force orakel-smoke
