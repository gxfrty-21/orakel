name: Tests

# Jeder Branch-Push testet den Branch auch ohne offenen Pull Request; main
# bleibt enthalten, damit Railway sein "Wait for CI" daran erkennt.
# Zusätzlich lässt sich der Workflow manuell starten. GitHub registriert
# dispatchbare Workflows erst, wenn diese Fassung auf dem Default-Branch und
# im gewählten Branch liegt.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  # Der Doku-Job wird nur bei Markdown- oder Prüfskript-Änderungen gestartet.
  # Ein per if übersprungener Job meldet Erfolg und bleibt als Required Check nutzbar.
  changes:
    name: Doku-relevante Änderungen ermitteln
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      doku: ${{ steps.filter.outputs.doku }}

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Markdown- und Prüfskript-Änderungen ermitteln
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          PUSH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          bash scripts/ermittle-doku-aenderungen.sh >> "$GITHUB_OUTPUT"

  pytest:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v5

      - name: Python einrichten
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      # Als Modul aufrufen, damit das Repo-Root für "import orakel" im Pfad liegt.
      # Protokoll und JUnit-XML werden als Artefakt an den Review-Job gegeben,
      # damit die Suite nur einmal läuft.
      - name: Tests ausführen
        run: |
          mkdir -p artifacts/pytest
          set +e
          python -m pytest -q tests --junitxml=artifacts/pytest/junit.xml 2>&1 \
            | tee artifacts/pytest/pytest.log
          code=${PIPESTATUS[0]}
          echo "$code" > artifacts/pytest/exit_code
          exit "$code"

      - name: pytest-Evidenz hochladen
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: pytest-evidenz
          path: |
            artifacts/pytest/pytest.log
            artifacts/pytest/junit.xml
            artifacts/pytest/exit_code
          if-no-files-found: error
          retention-days: 7

  # Hält die Grenze aus Bereich 4.1: Der Handelskern (orakel/kern) darf
  # nichts aus Web, Agenten, Nexus oder Betrieb importieren. Der Vertrag steht
  # in .importlinter; zusätzlich prüft tests/test_architektur.py dasselbe ohne
  # Zusatzpaket im normalen pytest-Lauf.
  architektur:
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v5

      - name: Python einrichten
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Import-Linter installieren
        run: |
          python -m pip install --upgrade pip
          python -m pip install import-linter==2.17

      - name: Architekturverträge prüfen
        run: lint-imports --verbose

  # Eigener sichtbarer Job: Prüft die versionierten Markdown-Dateien auf
  # relative Links, Markdown- und HTML-Anker, alte Raumschiff- und
  # Navigationsbegriffe sowie englische Altnamen der Agentenabteilungen.
  # Der Negativtest stellt sicher, dass ein kaputter Link, alte Begriffe und
  # englische Altnamen tatsächlich auffallen.
  doku:
    name: Doku-Prüfung
    needs: changes
    if: needs.changes.outputs.doku == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v5

      - name: Python einrichten
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Doku-Links, Anker und Begriffe prüfen
        run: |
          python scripts/pruefe_doku.py --negativtest
          python scripts/pruefe_doku.py

  # Prüft, dass das Review-Paket ausschliesslich freigegebene Quellen aus HEAD
  # enthält und jede Kopie byteweise zum Commit passt. Läuft ohne artifacts/,
  # weil aus dem Commit in ein temporäres Verzeichnis gebaut wird.
  review_paket:
    name: Review-Paket
    needs: pytest
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v5

      - name: Python einrichten
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # Das Protokoll kommt aus dem pytest-Job: eine Testzahl aus einem echten
      # Lauf, ohne die Suite ein zweites Mal zu starten. Skript und Doku-Prüfung
      # sind stdlib-only, deshalb hier kein pip install.
      - name: pytest-Evidenz übernehmen
        uses: actions/download-artifact@v6
        with:
          name: pytest-evidenz
          path: artifacts/pytest

      # Fehlende Evidenz, ein fremder Exit-Code oder ein Widerspruch zwischen
      # Protokoll und JUnit-Bericht ist ein Fehler.
      - name: Freigabe, Kopien, Hashes, Testzahl und ZIP prüfen
        run: |
          python scripts/baue_review_paket.py --pruefen --evidenz \
            --pytest-log artifacts/pytest/pytest.log \
            --pytest-exit-code artifacts/pytest/exit_code \
            --junit artifacts/pytest/junit.xml

  # Stellt sicher, dass das Dockerfile inklusive Seed-DB weiterhin baut.
  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v5

      - name: Buildx einrichten
        uses: docker/setup-buildx-action@v4

      # Layer-Cache aus dem GitHub-Actions-Cache; mode=max cached auch die
      # pip-install-Schicht, nicht nur das Basis-Image.
      - name: Image bauen
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          tags: orakel:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Startet das Image mit aktiviertem Login: Health muss offen bleiben,
      # / muss ohne Zugangsdaten 401 liefern.
      - name: Container starten, Health und Login-Schutz prüfen
        run: |
          docker run --detach --name orakel-smoke --publish 3000:3000 \
            --env ORAKEL_AUTH_USER=orakel --env ORAKEL_AUTH_PASS=geheim \
            orakel:ci

          gesund=0
          for versuch in $(seq 1 30); do
            if antwort=$(curl --silent --show-error --fail http://127.0.0.1:3000/api/health) \
               && python3 -c 'import json,sys; sys.exit(0 if json.loads(sys.argv[1]).get("ok") is True else 1)' "$antwort"; then
              echo "Health-Check ok nach ${versuch} Versuch(en): $antwort"
              gesund=1
              break
            fi
            sleep 2
          done
          if [ "$gesund" -ne 1 ]; then
            echo "Health-Check fehlgeschlagen"
            docker logs orakel-smoke
            exit 1
          fi

          status=$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:3000/)
          if [ "$status" != "401" ]; then
            echo "Erwartet HTTP 401 für /, erhalten $status"
            docker logs orakel-smoke
            exit 1
          fi
          echo "Login-Schutz ok: GET / ohne Zugangsdaten -> HTTP 401"

          status=$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --user orakel:geheim http://127.0.0.1:3000/)
          if [ "$status" != "200" ]; then
            echo "Erwartet HTTP 200 für / mit Zugangsdaten, erhalten $status"
            docker logs orakel-smoke
            exit 1
          fi
          echo "Login ok: GET / mit Zugangsdaten -> HTTP 200"

      - name: Container entfernen
        if: always()
        run: docker rm --force orakel-smoke

  # Prüft die Oberfläche mit 250 % Schrift und langen Komposita in Tabellen.
  # Nutzt die Seed-Datenbank, damit der Lauf ohne eigene Daten reproduzierbar ist.
  text250:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v5

      - name: Python einrichten
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Node einrichten
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: scripts/package-lock.json

      - name: Python-Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      # Der Schlüssel hängt an der Playwright-Version im Lockfile: Ändert sie
      # sich, wird der Browser neu geladen statt einen alten Cache zu nutzen.
      - name: Playwright-Browser cachen
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('scripts/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      # Auch ein hängender Download soll das Job-Limit nicht ausschöpfen.
      - name: Playwright und Chromium installieren
        timeout-minutes: 5
        working-directory: scripts
        run: |
          npm ci
          # Systembibliotheken bringt das ubuntu-24.04-Image mit; --with-deps
          # kostet pro Lauf 8-11 Sekunden apt-Zeit.
          npx playwright install chromium

      # Ein hängender Browser soll nicht das Job-Limit von 15 Minuten
      # ausschöpfen. Der Step-Timeout gilt als Fehlschlag, sodass Log und
      # Screenshots danach hochgeladen werden. Der Lauf prüft zusätzlich alle
      # zwölf Ansichten in normaler Schrift bei 240 px.
      - name: Dashboard starten und 250-%-Prüflauf ausführen
        timeout-minutes: 5
        run: |
          set -euo pipefail
          mkdir -p artifacts/text250
          cp seed/orakel-seed.db /tmp/orakel-text250.db
          ORAKEL_DB_PFAD=/tmp/orakel-text250.db \
            python -m orakel serve --host 127.0.0.1 --port 3000 > artifacts/text250/server.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT

          bereit=0
          for versuch in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:3000/api/report > /dev/null; then
              echo "Dashboard bereit nach ${versuch} Versuch(en)"
              bereit=1
              break
            fi
            sleep 1
          done
          if [ "$bereit" -ne 1 ]; then
            echo "Dashboard wurde nicht bereit"
            cat artifacts/text250/server.log
            exit 1
          fi

          if ! node scripts/pruefe-text250.mjs --bilder artifacts/text250 \
               --ergebnis artifacts/text250/ergebnis.json | tee artifacts/text250/lauf.log; then
            echo "--- Serverprotokoll ---"
            tail -50 artifacts/text250/server.log
            exit 1
          fi
          # Skip-Logik dauerhaft absichern: erwarteter Skip muss erlaubt,
          # unerwarteter Skip muss erkannt werden.
          node scripts/pruefe-text250-ergebnis.mjs --selbsttest
          # CI prüft Fall-IDs und erwartete Zähler aus dem Manifest statt
          # Klartextzeilen zu greppen. Profil «voll» gilt für diesen Lauf.
          node scripts/pruefe-text250-ergebnis.mjs \
            --ergebnis artifacts/text250/ergebnis.json \
            --pflicht scripts/text250-required-checks.json \
            --profil voll

          # Der Negativtest schreibt absichtlich falsche Kerndaten ins DOM und
          # muss für jede der sechs Inhaltsansichten, den fehlenden Abteilungstab,
          # den fehlenden und den geleerten Schiffsabteilungscluster, einen
          # fehlenden Agenten, einen zusätzlichen Agenten in einem zweiten
          # Cluster, doppelte Agenten-IDs über Cluster hinweg und im selben
          # Cluster bei gleicher Agentenzahl sowie einen fehlenden
          # Widerspruchsgrund und eine fehlende Widerspruchssicherheit einen
          # Befund erzeugen. Drei weitere Fälle injizieren abgeschnittenen
          # Inhalt, überlappende statische Steuerelemente und einen fehlenden
          # Fokusring.
          if ! node scripts/pruefe-text250.mjs --negativtest \
               --ergebnis artifacts/text250/negativtest-ergebnis.json \
               > artifacts/text250/negativtest.log 2>&1; then
            echo "--- Negativtest fehlgeschlagen ---"
            cat artifacts/text250/negativtest.log
            exit 1
          fi
          cat artifacts/text250/negativtest.log
          node scripts/pruefe-text250-ergebnis.mjs \
            --ergebnis artifacts/text250/negativtest-ergebnis.json \
            --pflicht scripts/text250-required-checks.json \
            --profil negativtest

          # Die Selbsttests brauchen denselben noch laufenden Seed-Server.
          mkdir -p artifacts/text250/selbsttest
          if ! node scripts/pruefe-text250.mjs --url http://127.0.0.1:3000 \
               --selbsttest-cluster --bilder artifacts/text250/selbsttest \
               --bild-praefix selbsttest \
               --ergebnis artifacts/text250/selbsttest-ergebnis.json \
               > artifacts/text250/selbsttest.log 2>&1; then
            echo "--- Selbsttest fehlgeschlagen ---"
            cat artifacts/text250/selbsttest.log
            echo "--- Serverprotokoll ---"
            tail -50 artifacts/text250/server.log
            exit 1
          fi
          cat artifacts/text250/selbsttest.log
          node scripts/pruefe-text250-ergebnis.mjs \
            --ergebnis artifacts/text250/selbsttest-ergebnis.json \
            --pflicht scripts/text250-required-checks.json \
            --profil selbsttest-cluster
          s_bild=$(find artifacts/text250/selbsttest -maxdepth 1 \
            -name 'selbsttest-360px-ship-cluster-*-abteilung-s-fehlt.png' \
            -size +0c -print -quit)
          test -n "$s_bild"
          test -s artifacts/text250/selbsttest/selbsttest-360px-ship.html

          # Eigener Selbsttest für einen fehlenden Agenten. Er nutzt denselben
          # Seed-Server und einen eigenen Präfix, damit die Diagnosen des
          # Cluster-Selbsttests erhalten bleiben.
          if ! node scripts/pruefe-text250.mjs --url http://127.0.0.1:3000 \
               --selbsttest-agent --bilder artifacts/text250/selbsttest \
               --bild-praefix selbsttest-agent \
               --ergebnis artifacts/text250/selbsttest-agent-ergebnis.json \
               > artifacts/text250/selbsttest-agent.log 2>&1; then
            echo "--- Agent-Selbsttest fehlgeschlagen ---"
            cat artifacts/text250/selbsttest-agent.log
            echo "--- Serverprotokoll ---"
            tail -50 artifacts/text250/server.log
            exit 1
          fi
          cat artifacts/text250/selbsttest-agent.log
          node scripts/pruefe-text250-ergebnis.mjs \
            --ergebnis artifacts/text250/selbsttest-agent-ergebnis.json \
            --pflicht scripts/text250-required-checks.json \
            --profil selbsttest-agent
          test -s artifacts/text250/selbsttest/selbsttest-agent-360px-ship-cluster-01-abteilung-a-hat-9-statt-10-agenten.png
          test -s artifacts/text250/selbsttest/selbsttest-agent-360px-ship.html
          test -s artifacts/text250/selbsttest/selbsttest-agent-text250-befunde.txt

      # Der Selbsttest erzeugt mehrere Clusterbefunde in einem Lauf. Dieser
      # Schritt prüft unabhängig vom Testprozess, dass jeder Befund eine eigene,
      # nicht-leere Screenshotdatei erhalten hat und keine Namen doppelt sind.
      - name: Eindeutige Screenshotnamen bei mehreren Clusterfehlern prüfen
        run: |
          set -euo pipefail
          scripts/pruefe-cluster-screenshotnamen.sh \
            artifacts/text250/selbsttest.log \
            artifacts/text250/selbsttest

      # Bewusste Duplikat-Probe: Ein zusätzlicher Log-Eintrag mit demselben
      # Screenshotpfad muss die Prüfung mit einem Duplikatbefund beenden.
      - name: Duplikat-Probe für Cluster-Screenshotnamen
        run: |
          set -euo pipefail
          probe_log=artifacts/text250/selbsttest-duplikat.log
          probe_ausgabe=artifacts/text250/duplikat-probe.log
          cp artifacts/text250/selbsttest.log "$probe_log"
          erster=$(grep -m1 '^Screenshot: ' "$probe_log")
          if [ -z "$erster" ]; then
            echo "Duplikat-Probe: kein Screenshot-Eintrag im Selbsttestlog"
            exit 1
          fi
          printf '%s\n' "$erster" >> "$probe_log"
          if scripts/pruefe-cluster-screenshotnamen.sh \
               "$probe_log" artifacts/text250/selbsttest > "$probe_ausgabe" 2>&1; then
            echo "Duplikat-Probe FEHLER: doppelter Screenshotname wurde nicht erkannt"
            cat "$probe_ausgabe"
            exit 1
          fi
          grep -q '^Doppelte Screenshot-Namen:' "$probe_ausgabe"
          echo "Duplikat-Probe OK: doppelter Screenshotname erkannt"



      # Eigener, fokussierter Lauf: Die fünf API-Stichproben werden auf einer
      # frischen Seed-Kopie ausschliesslich per Tastatur angesteuert. Zusätzlich
      # prüft der Lauf die elf Schiffscluster samt erwarteter Agentenzahl, die
      # Gesamtsumme von 103 Agenten, eindeutige Agenten-IDs und die Ops-Legende.
      # Alle Zusammenfassungen müssen erscheinen, damit ein stilles Überspringen
      # auffällt.
      - name: Seed-Tastaturlauf ausführen
        timeout-minutes: 5
        run: |
          set -euo pipefail
          mkdir -p artifacts/text250
          cp seed/orakel-seed.db /tmp/orakel-seed-tastatur.db
          ORAKEL_DB_PFAD=/tmp/orakel-seed-tastatur.db \
            python -m orakel serve --host 127.0.0.1 --port 3100 > artifacts/text250/seed-tastatur-server.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT

          bereit=0
          for versuch in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:3100/api/report > /dev/null; then
              echo "Seed-Dashboard bereit nach ${versuch} Versuch(en)"
              bereit=1
              break
            fi
            sleep 1
          done
          if [ "$bereit" -ne 1 ]; then
            echo "Seed-Dashboard wurde nicht bereit"
            cat artifacts/text250/seed-tastatur-server.log
            exit 1
          fi

          if ! node scripts/pruefe-text250.mjs --url http://127.0.0.1:3100 \
               --ansichten lab,ship --breiten 360,320,280 --ohne-tabellen \
               --bilder artifacts/text250 --bild-praefix seed-tastatur \
               --ergebnis artifacts/text250/seed-tastatur-ergebnis.json \
               > artifacts/text250/seed-tastatur.log 2>&1; then
            echo "--- Seed-Tastaturlauf fehlgeschlagen ---"
            cat artifacts/text250/seed-tastatur.log
            tail -50 artifacts/text250/seed-tastatur-server.log
            exit 1
          fi
          cat artifacts/text250/seed-tastatur.log
          node scripts/pruefe-text250-ergebnis.mjs \
            --ergebnis artifacts/text250/seed-tastatur-ergebnis.json \
            --pflicht scripts/text250-required-checks.json \
            --profil seed-tastatur

      # Kompakter Erfolgsnachweis: nur die beiden Protokolle des text250-Jobs,
      # ohne Screenshots, HTML oder Serverlogs.
      - name: Lauf- und Negativtest-Log bei Erfolg hochladen
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: text250-laufprotokoll
          path: |
            artifacts/text250/lauf.log
            artifacts/text250/negativtest.log
            artifacts/text250/ergebnis.json
            artifacts/text250/*-ergebnis.json
          if-no-files-found: error
          retention-days: 7

      # Auch bei Abbruch oder Timeout: Der Job gilt dann als abgebrochen.
      - name: Screenshots, Befunde und HTML bei Fehlschlag hochladen
        if: failure() || cancelled()
        uses: actions/upload-artifact@v6
        with:
          name: text250-diagnose
          path: |
            artifacts/text250/*.png
            artifacts/text250/*.html
            artifacts/text250/*.txt
            artifacts/text250/ergebnis.json
            artifacts/text250/*-ergebnis.json
            artifacts/text250/selbsttest/*.png
            artifacts/text250/selbsttest/*.html
            artifacts/text250/selbsttest/*.txt
          if-no-files-found: ignore
          retention-days: 7

      - name: Serverprotokoll bei Fehlschlag hochladen
        if: failure() || cancelled()
        uses: actions/upload-artifact@v6
        with:
          name: text250-serverlog
          path: |
            artifacts/text250/server.log
            artifacts/text250/seed-tastatur-server.log
            artifacts/text250/seed-tastatur.log
          if-no-files-found: ignore
          retention-days: 7

  # Eigener Job mit stabilem Check-Namen. Er kann in der Branch-Regel
  # «main: PR und gruene CI» als Required Check «Widerspruch-E2E 3/3»
  # eingetragen werden, ohne vom text250-Job abhängig zu sein.
  widerspruch_e2e:
    name: Widerspruch-E2E 3/3
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v5

      - name: Python einrichten
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Node einrichten
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: scripts/package-lock.json

      - name: Python-Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Playwright-Browser cachen
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('scripts/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Playwright und Chromium installieren
        timeout-minutes: 5
        working-directory: scripts
        run: |
          npm ci
          npx playwright install chromium

      # Der Job nutzt eine eigene Seed-Kopie und einen eigenen Port. Damit
      # bleibt der 3/3-Nachweis unabhängig vom text250-Lauf sichtbar.
      - name: Widerspruch-E2E und Negativtest 3/3 ausführen
        timeout-minutes: 4
        run: |
          set -euo pipefail
          mkdir -p artifacts/widerspruch-e2e
          cp seed/orakel-seed.db /tmp/orakel-widerspruch-e2e.db
          python scripts/seed_widerspruch.py /tmp/orakel-widerspruch-e2e.db
          ORAKEL_DB_PFAD=/tmp/orakel-widerspruch-e2e.db \
            python -m orakel serve --host 127.0.0.1 --port 3300 > artifacts/widerspruch-e2e/server.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT

          bereit=0
          for versuch in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:3300/api/nexus/status > /dev/null; then
              echo "Widerspruch-Dashboard bereit nach ${versuch} Versuch(en)"
              bereit=1
              break
            fi
            sleep 1
          done
          if [ "$bereit" -ne 1 ]; then
            echo "Widerspruch-Dashboard wurde nicht bereit"
            cat artifacts/widerspruch-e2e/server.log
            exit 1
          fi

          if ! node scripts/pruefe-widerspruch-e2e.mjs --url http://127.0.0.1:3300 \
               --ergebnis artifacts/widerspruch-e2e/lauf.json \
               | tee artifacts/widerspruch-e2e/lauf.log; then
            echo "--- Widerspruch-E2E fehlgeschlagen ---"
            tail -50 artifacts/widerspruch-e2e/server.log
            exit 1
          fi
          node scripts/pruefe-json-erwartung.mjs \
            artifacts/widerspruch-e2e/lauf.json ok=true positiv.geprueft=1

          # Der Negativlauf verändert nur das DOM der Testseite und eine Kopie
          # der API-Antwort: einmal wird der Widerspruchsgrund verfälscht, einmal
          # die Detailzeile entfernt und einmal die Widerspruchszeile aus der
          # API-Kopie gelöscht. Alle drei Fälle müssen erkannt werden.
          if ! node scripts/pruefe-widerspruch-e2e.mjs --url http://127.0.0.1:3300 \
               --negativtest --ergebnis artifacts/widerspruch-e2e/negativtest.json \
               | tee artifacts/widerspruch-e2e/negativtest.log; then
            echo "--- Widerspruch-E2E-Negativtest fehlgeschlagen ---"
            tail -50 artifacts/widerspruch-e2e/server.log
            exit 1
          fi
          node scripts/pruefe-json-erwartung.mjs \
            artifacts/widerspruch-e2e/negativtest.json \
            ok=true negativ.faelle=3 negativ.erkannt=3
          echo "Widerspruch-E2E-Negativtest: 3/3 bestanden"
          {
            echo "### Widerspruch-E2E-Negativtest"
            echo ""
            echo "**3/3 bestanden:** falsche DOM-Zeile, fehlende DOM-Zeile "
            echo "und fehlende API-Zeile wurden erkannt."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Erfolgsartefakt Widerspruch-E2E 3/3 hochladen
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: widerspruch-e2e-3-3-erfolg
          path: |
            artifacts/widerspruch-e2e/lauf.log
            artifacts/widerspruch-e2e/negativtest.log
            artifacts/widerspruch-e2e/lauf.json
            artifacts/widerspruch-e2e/negativtest.json
          if-no-files-found: error
          retention-days: 7

      - name: Diagnose Widerspruch-E2E 3/3 bei Fehlschlag hochladen
        if: failure() || cancelled()
        uses: actions/upload-artifact@v6
        with:
          name: widerspruch-e2e-3-3-diagnose
          path: artifacts/widerspruch-e2e/*
          if-no-files-found: ignore
          retention-days: 7

  # Prüft die Schiffsansicht mit echten Touch-Events (CDP): Ein-Finger-Pan,
  # Zwei-Finger-Pinch und Tippen auf einen Raum, zusätzlich einen zweiten
  # Porträt-Viewport und Querformat. Eigener sichtbarer Job, damit ein
  # gebrochenes Touch-Verhalten nicht im Textskalierungs-Lauf untergeht.
  touch:
    name: Touch-Test
    runs-on: ubuntu-24.04
    timeout-minutes: 12

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v5

      - name: Python einrichten
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Node einrichten
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: scripts/package-lock.json

      - name: Python-Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Playwright-Browser cachen
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('scripts/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Playwright und Chromium installieren
        timeout-minutes: 5
        working-directory: scripts
        run: |
          npm ci
          npx playwright install chromium

      - name: Seed-Dashboard starten und Touch-Test ausführen
        timeout-minutes: 5
        run: |
          set -euo pipefail
          mkdir -p artifacts/touch
          cp seed/orakel-seed.db /tmp/orakel-touch.db
          ORAKEL_DB_PFAD=/tmp/orakel-touch.db \
            python -m orakel serve --host 127.0.0.1 --port 3200 > artifacts/touch/server.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT

          bereit=0
          for versuch in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:3200/api/report > /dev/null; then
              echo "Seed-Dashboard bereit nach ${versuch} Versuch(en)"
              bereit=1
              break
            fi
            sleep 1
          done
          if [ "$bereit" -ne 1 ]; then
            echo "Seed-Dashboard wurde nicht bereit"
            cat artifacts/touch/server.log
            exit 1
          fi

          if ! node scripts/pruefe-touch.mjs --url http://127.0.0.1:3200 \
               --bilder artifacts/touch --ergebnis artifacts/touch/touch.json \
               > artifacts/touch/touch.log 2>&1; then
            echo "--- Touch-Test fehlgeschlagen ---"
            cat artifacts/touch/touch.log
            echo "--- Serverprotokoll ---"
            tail -50 artifacts/touch/server.log
            exit 1
          fi
          cat artifacts/touch/touch.log
          node scripts/pruefe-json-erwartung.mjs artifacts/touch/touch.json \
            ok=true fehler=0 pan=true pinch=true tippen=true legende=true \
            filter=true fit390=true fit320=true viewports=6

      - name: Touch-Artefakte bei Fehlschlag hochladen
        if: failure() || cancelled()
        uses: actions/upload-artifact@v6
        with:
          name: touch-fehler
          path: artifacts/touch/*
          if-no-files-found: ignore
          retention-days: 7

  # Qualitätstor aus Bereich 6.4: blinde Fänge (BLE001), stille
  # Fehlerschlucker (S110) und die Sicherheitsregeln aus flake8-bandit (S).
  # Die Regeln und die Schuldenliste des Altbestands stehen in ruff.toml;
  # orakel/kern/, alle Tests und jedes neue Modul sind nicht ausgenommen.
  ruff:
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v5

      - name: Python einrichten
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Lint-Regeln prüfen
        run: python -m ruff check . --output-format=github

  # Typprüfung des Handelskerns nach mypy.ini: paper, risk, backtest und judge
  # samt der von ihnen importierten Kernmodule. Web, Agenten und Nexus bleiben
  # bewusst aussen vor.
  mypy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v5

      - name: Python einrichten
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Handelskern typisieren
        run: python -m mypy

  # Untergrenze für die vier Module, die über Geld und Urteil entscheiden.
  # Der Stand bei Einführung liegt bei 89 %; die Grenze von 85 % lässt kleinen
  # Umbauten Luft, meldet aber jedes Absinken. Die Tests bleiben unverändert.
  coverage:
    name: Coverage Handelskern
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v5

      - name: Python einrichten
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Coverage der vier Kernmodule messen
        run: |
          python -m pytest -q \
            --cov=orakel.kern.paper --cov=orakel.kern.risk \
            --cov=orakel.kern.backtest --cov=orakel.kern.judge \
            --cov-report=term-missing --cov-fail-under=85
