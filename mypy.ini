# Typprüfung für den Handelskern (Bereich 6.4).
#
# Geprüft werden die vier Module, die über Geld, Risiko und Urteil
# entscheiden. Die von ihnen importierten Kernmodule (data, db, strategien …)
# zieht mypy mit hinein, damit die Zusagen an den Schnittstellen stimmen.
# Web, Agenten und Nexus bleiben aussen vor: dort ist die Typisierung noch
# nicht weit genug, und ein Tor über Nacht umzustellen würde nur ignores
# erzeugen.
[mypy]
python_version = 3.12
files = orakel/kern/paper.py, orakel/kern/risk.py, orakel/kern/backtest.py, orakel/kern/judge.py
ignore_missing_imports = True
check_untyped_defs = True
warn_unused_configs = True
warn_redundant_casts = True
