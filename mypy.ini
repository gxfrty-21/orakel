# Typprüfung des Handelskerns. Geprüft werden die vier Module, in denen
# Positionsgrössen, Risikogrenzen, Backtest-Ausführung und Richter entschieden
# werden; mypy zieht die von ihnen importierten Kernmodule mit hinein.
# Web, Agenten und Nexus bleiben aussen vor: Dort würde ein Tor über Nacht nur
# ignore-Zeilen erzeugen. Lokal: python -m mypy
[mypy]
python_version = 3.12
files = orakel/paper.py, orakel/risk.py, orakel/backtest.py, orakel/judge.py
check_untyped_defs = True
disallow_untyped_defs = True
disallow_incomplete_defs = True
no_implicit_optional = True
warn_redundant_casts = True
warn_unused_ignores = True
strict_equality = True
